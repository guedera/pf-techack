name: pf-techack

services:
  juice-shop:
    image: ${JUICE_SHOP_IMAGE:-bkimminich/juice-shop:latest}
    ports:
      - "${LAB_BIND_IP:-127.0.0.1}:${JUICE_SHOP_PORT:-3000}:3000"
    # Sem volumes: recriar o contêiner descarta os dados de teste.
    init: true
    restart: "no"
    mem_limit: 768m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "require('http').get('http://127.0.0.1:3000/',r=>{r.resume();process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    networks: [target]

  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "2048"
      OLLAMA_KEEP_ALIVE: "2m"
      LAB_MODEL: ${OLLAMA_MODEL:-qwen3:1.7b}
    volumes:
      - ollama-data:/root/.ollama
    restart: "no"
    mem_limit: ${OLLAMA_MEMORY:-3g}
    cpus: ${OLLAMA_CPUS:-3}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks: [model]

  tools:
    profiles: [tools]
    build: ./docker/tools
    command: ["python3", "--version"]
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 256m
    networks: [target]

volumes:
  ollama-data:

networks:
  target:
  model:
